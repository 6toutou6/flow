<style>
        body { font-family: 'Inter', sans-serif; background-color: #F7FAFC; }

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface text-on-surface overflow-hidden">

    <!-- SideNavBar -->
    <aside class="fixed left-0 top-0 h-full w-[280px] bg-surface-container-lowest border-r border-outline-variant flex flex-col z-50">
        <div class="p-lg">
            <div class="font-headline-md text-headline-md font-bold text-primary">Axiom Workflow</div>
            <div class="text-secondary text-label-sm opacity-70">Enterprise Edition</div>
        </div>
        
        <nav class="flex-grow py-md custom-scrollbar overflow-y-auto">
            <ul class="space-y-1 px-sm">
                <li>
                    <a href="#" class="flex items-center gap-md px-md py-sm rounded transition-all duration-200 text-secondary hover:bg-surface-container">
                        <span class="material-symbols-outlined" data-icon="description">description</span>
                        <span class="font-body-md text-body-md">Templates</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center gap-md px-md py-sm rounded transition-all duration-200 text-secondary hover:bg-surface-container">
                        <span class="material-symbols-outlined" data-icon="edit_note">edit_note</span>
                        <span class="font-body-md text-body-md">Form Designer</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center gap-md px-md py-sm rounded transition-all duration-200 text-primary font-bold border-r-4 border-primary bg-surface-container-low">
                        <span class="material-symbols-outlined" data-icon="assignment_turned_in" style="font-variation-settings: 'FILL' 1;">assignment_turned_in</span>
                        <span class="font-body-md text-body-md">Task Distribution</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center gap-md px-md py-sm rounded transition-all duration-200 text-secondary hover:bg-surface-container">
                        <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                        <span class="font-body-md text-body-md">Data Dashboard</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="p-md border-t border-outline-variant mt-auto">
            <ul class="space-y-1">
                <li>
                    <a href="#" class="flex items-center gap-md px-md py-sm text-secondary hover:text-primary transition-colors">
                        <span class="material-symbols-outlined" data-icon="settings">settings</span>
                        <span class="text-label-md">Settings</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center gap-md px-md py-sm text-secondary hover:text-primary transition-colors">
                        <span class="material-symbols-outlined" data-icon="help">help</span>
                        <span class="text-label-md">Support</span>
                    </a>
                </li>
            </ul>
        </div>
    </aside>

    <!-- TopAppBar -->
    <header class="fixed top-0 right-0 left-[280px] h-16 bg-surface border-b border-outline-variant shadow-sm z-40 flex justify-between items-center px-lg">
        <div class="flex items-center gap-xl">
            <h1 class="font-headline-sm text-headline-sm font-black text-primary">任务下发配置</h1>
            <nav class="hidden md:flex gap-lg">
                <a href="#" class="text-on-surface-variant font-label-md hover:text-primary transition-colors">Dashboard</a>
                <a href="#" class="text-on-surface-variant font-label-md hover:text-primary transition-colors">Analytics</a>
                <a href="#" class="text-on-surface-variant font-label-md hover:text-primary transition-colors">Reports</a>
            </nav>
        </div>
        
        <div class="flex items-center gap-md">
            <div class="relative group">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-secondary opacity-50">search</span>
                <input type="text" placeholder="搜索任务或模版..." class="bg-surface-container-low border-none rounded-full pl-10 pr-4 py-2 text-sm w-64 focus:ring-2 focus:ring-primary/20 transition-all">
            </div>
            <button class="p-2 hover:bg-surface-container rounded-full transition-transform active:scale-90">
                <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
            </button>
            <button class="p-2 hover:bg-surface-container rounded-full transition-transform active:scale-90">
                <span class="material-symbols-outlined" data-icon="apps">apps</span>
            </button>
            <div class="h-8 w-8 rounded-full overflow-hidden border border-outline-variant">
                <img src="placeholder" data-alt="Professional headshot of a corporate administrator in a dark suit with a neutral background, high-end photography with soft lighting, matching the crimson and slate professional color palette of a high-stakes enterprise environment." class="w-full h-full object-cover">
            </div>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="ml-[280px] pt-16 h-screen flex flex-col bg-surface overflow-hidden">
        
        <!-- Workflow Steps Bar -->
        <div class="bg-surface-container-lowest px-xl py-md border-b border-outline-variant flex items-center gap-xl">
            <div class="flex items-center gap-sm step-active pb-1">
                <span class="w-6 h-6 flex items-center justify-center rounded-full bg-primary text-white text-[12px] font-bold">1</span>
                <span class="text-label-md">选择模版</span>
            </div>
            <div class="w-12 h-[1px] bg-outline-variant"></div>
            <div class="flex items-center gap-sm text-secondary pb-1">
                <span class="w-6 h-6 flex items-center justify-center rounded-full border border-secondary text-[12px] font-bold">2</span>
                <span class="text-label-md">任务详情</span>
            </div>
            <div class="w-12 h-[1px] bg-outline-variant"></div>
            <div class="flex items-center gap-sm text-secondary pb-1">
                <span class="w-6 h-6 flex items-center justify-center rounded-full border border-secondary text-[12px] font-bold">3</span>
                <span class="text-label-md">指派目标</span>
            </div>
        </div>

        <!-- Scrollable Form Area -->
        <div class="flex-grow overflow-y-auto custom-scrollbar p-xl drafting-grid">
            <div class="max-w-[1000px] mx-auto space-y-xl">
                
                <!-- Section 1: Template Selection -->
                <section class="bg-white border border-outline-variant rounded-lg p-lg shadow-sm">
                    <div class="flex items-center gap-sm mb-lg border-l-4 border-primary pl-md">
                        <span class="material-symbols-outlined text-primary" data-icon="list">list</span>
                        <h2 class="font-headline-sm text-headline-sm">模版选择</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-md">
                        <!-- Template Card -->
                        <div class="border-2 border-primary bg-primary/5 rounded-xl p-md cursor-pointer hover:shadow-md transition-all relative">
                            <div class="absolute top-2 right-2 text-primary">
                                <span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                            </div>
                            <div class="w-10 h-10 bg-primary/10 rounded flex items-center justify-center text-primary mb-md">
                                <span class="material-symbols-outlined">assignment</span>
                            </div>
                            <h3 class="font-bold text-on-surface mb-xs">季度安全检查</h3>
                            <p class="text-body-sm text-secondary opacity-80 mb-md">标准流程模版，包含12个检查项与现场照片上传功能。</p>
                            <span class="text-xs font-bold text-primary bg-primary/10 px-2 py-1 rounded">最常用</span>
                        </div>
                        
                        <div class="border border-outline-variant hover:border-primary/50 rounded-xl p-md cursor-pointer hover:shadow-md transition-all">
                            <div class="w-10 h-10 bg-secondary/10 rounded flex items-center justify-center text-secondary mb-md">
                                <span class="material-symbols-outlined">analytics</span>
                            </div>
                            <h3 class="font-bold text-on-surface mb-xs">周度运营汇报</h3>
                            <p class="text-body-sm text-secondary opacity-80 mb-md">收集各部门KPI达成情况与下周计划，自动生成汇总表。</p>
                        </div>

                        <div class="border border-dashed border-outline-variant flex flex-col items-center justify-center rounded-xl p-md cursor-pointer hover:bg-surface-container transition-all">
                            <span class="material-symbols-outlined text-secondary opacity-50 text-4xl mb-sm">add_circle</span>
                            <span class="text-label-md text-secondary">从零开始创建</span>
                        </div>
                    </div>
                </section>

                <!-- Section 2: Task Details -->
                <section class="bg-white border border-outline-variant rounded-lg p-lg shadow-sm">
                    <div class="flex items-center gap-sm mb-lg border-l-4 border-primary pl-md">
                        <span class="material-symbols-outlined text-primary" data-icon="calendar_month">calendar_month</span>
                        <h2 class="font-headline-sm text-headline-sm">任务详情配置</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
                        <div class="flex flex-col gap-sm">
                            <label class="text-label-md font-bold text-on-surface-variant">任务名称 <span class="text-primary">*</span></label>
                            <input type="text" value="2024年Q3安全生产专项检查" class="border border-outline rounded p-md focus:border-primary focus:ring-primary focus:ring-opacity-20 outline-none transition-all">
                        </div>
                        <div class="flex flex-col gap-sm">
                            <label class="text-label-md font-bold text-on-surface-variant">截止时间 <span class="text-primary">*</span></label>
                            <div class="relative">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-secondary">event</span>
                                <input type="date" class="w-full border border-outline rounded p-md pl-10 focus:border-primary focus:ring-primary focus:ring-opacity-20 outline-none transition-all">
                            </div>
                        </div>
                        <div class="col-span-1 md:col-span-2 flex flex-col gap-sm">
                            <label class="text-label-md font-bold text-on-surface-variant">下发公告 / 注意事项</label>
                            <textarea rows="4" placeholder="请输入具体执行要求、注意事项等提示文字..." class="border border-outline rounded p-md focus:border-primary focus:ring-primary focus:ring-opacity-20 outline-none transition-all resize-none">请各部门安全员严格按照模版要求核查现场，所有不合格项必须附带清晰照片证据。任务截止后系统将自动关闭提交权限。</textarea>
                        </div>
                    </div>
                </section>

                <!-- Section 3: Target Audience -->
                <section class="bg-white border border-outline-variant rounded-lg p-lg shadow-sm">
                    <div class="flex items-center gap-sm mb-lg border-l-4 border-primary pl-md">
                        <span class="material-symbols-outlined text-primary" data-icon="person">person</span>
                        <h2 class="font-headline-sm text-headline-sm">目标受众</h2>
                    </div>
                    <div class="flex flex-col gap-lg">
                        <div class="flex gap-md">
                            <button class="bg-primary text-white font-bold px-lg py-sm rounded-lg hover:brightness-110 transition-all flex items-center gap-sm">
                                <span class="material-symbols-outlined">account_tree</span>
                                选择部门
                            </button>
                            <button class="bg-surface-container text-secondary font-bold px-lg py-sm rounded-lg hover:bg-surface-container-high transition-all flex items-center gap-sm">
                                <span class="material-symbols-outlined">group_add</span>
                                指定人员
                            </button>
                        </div>
                        
                        <div class="border border-outline-variant rounded-lg overflow-hidden">
                            <div class="bg-surface-container px-md py-sm border-b border-outline-variant flex justify-between items-center">
                                <span class="text-label-sm font-bold">已选对象 (4)</span>
                                <button class="text-primary text-label-sm hover:underline">清空全部</button>
                            </div>
                            <div class="p-md flex flex-wrap gap-sm">
                                <div class="flex items-center gap-xs bg-surface-container-low border border-outline-variant rounded px-sm py-1">
                                    <span class="text-body-sm">生产制造部</span>
                                    <button class="material-symbols-outlined text-xs opacity-50 hover:opacity-100">close</button>
                                </div>
                                <div class="flex items-center gap-xs bg-surface-container-low border border-outline-variant rounded px-sm py-1">
                                    <span class="text-body-sm">仓储物流部</span>
                                    <button class="material-symbols-outlined text-xs opacity-50 hover:opacity-100">close</button>
                                </div>
                                <div class="flex items-center gap-xs bg-surface-container-low border border-outline-variant rounded px-sm py-1">
                                    <span class="text-body-sm">安全环保处</span>
                                    <button class="material-symbols-outlined text-xs opacity-50 hover:opacity-100">close</button>
                                </div>
                                <div class="flex items-center gap-xs bg-surface-container-low border border-outline-variant rounded px-sm py-1">
                                    <span class="text-body-sm">张利民 (管理员)</span>
                                    <button class="material-symbols-outlined text-xs opacity-50 hover:opacity-100">close</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="h-10"></div> <!-- Spacer for scrolling -->
            </div>
        </div>

        <!-- Sticky Footer Actions -->
        <footer class="h-20 bg-white border-t border-outline-variant px-xl flex items-center justify-between shadow-lg relative z-10">
            <div class="text-secondary text-label-md italic opacity-60">
                * 确认下发后，所有受众将实时收到系统通知。
            </div>
            <div class="flex gap-md">
                <button class="px-xl py-sm bg-secondary/10 text-secondary font-bold rounded-lg hover:bg-secondary/20 transition-all">取消操作</button>
                <button id="distributeBtn" class="px-xl py-sm bg-primary text-white font-bold rounded-lg hover:brightness-110 active:scale-95 transition-all shadow-md flex items-center gap-md">
                    <span class="material-symbols-outlined text-[18px]">rocket_launch</span>
                    立即下发任务
                </button>
            </div>
        </footer>

    </main>

    <!-- Notification Micro-interaction Layer -->
    <div id="toast" class="fixed bottom-24 right-8 bg-inverse-surface text-inverse-on-surface px-lg py-md rounded-xl shadow-2xl translate-y-32 opacity-0 transition-all duration-500 z-[100] flex items-center gap-md">
        <span class="material-symbols-outlined text-green-400">check_circle</span>
        <div class="flex flex-col">
            <span class="font-bold text-label-md">任务下发成功</span>
            <span class="text-xs opacity-70">4 个部门及 1 名用户已同步。</span>
        </div>
    </div>

    <script>
        document.getElementById('distributeBtn').addEventListener('click', function() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-32', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            this.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> 正在处理...';
            this.disabled = true;
            this.classList.add('opacity-70', 'cursor-not-allowed');

            setTimeout(() => {
                toast.classList.add('translate-y-32', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
                
                this.innerHTML = '<span class="material-symbols-outlined text-[18px]">rocket_launch</span> 立即下发任务';
                this.disabled = false;
                this.classList.remove('opacity-70', 'cursor-not-allowed');
            }, 3000);
        });

        // Hover animation for cards
        const cards = document.querySelectorAll('section > div > div.border');
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-2px)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
